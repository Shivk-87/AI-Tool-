name: CI
on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
      - name: Run pytest
        run: |
          export PYTHONPATH=.
          pytest -q

  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r src/backend/requirements.txt
      - name: Start backend
        run: |
          export PYTHONPATH=.
          nohup uvicorn src.backend.app:app --port 8000 &
          sleep 5
      - name: Smoke index
        run: |
          curl -sS -X POST "http://127.0.0.1:8000/index" -H "Content-Type: application/json" -d '{"repo_url":"https://github.com/octocat/Hello-World.git","project":"hello-world-ci"}' || true
      - name: Retrieve
        run: |
          curl -sS "http://127.0.0.1:8000/retrieve?q=readme&k=3" || true