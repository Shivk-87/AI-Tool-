apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codebase-steward.fullname" . | default "codebase-steward" }}
  labels:
    app: {{ include "codebase-steward.name" . | default "codebase-steward" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: codebase-steward
  template:
    metadata:
      labels:
        app: codebase-steward
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: MILVUS_HOST
              value: "{{ .Values.milvus.host }}"
            - name: MILVUS_PORT
              value: "{{ .Values.milvus.port }}"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
