replicaCount: 1

image:
  repository: ghcr.io/your-org/codebase-steward
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

nodeSelector: {}

tolerations: []

persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

milvus:
  enabled: false
  host: "milvus.default.svc.cluster.local"
  port: 19530

modelServing:
  enabled: true
  replicaCount: 1
  image: ghcr.io/your-org/llama2-13b-serving:latest
  port: 8001
  pullPolicy: IfNotPresent
  modelPath: "/models"
  gpu:
    enabled: true
    requests: 1
    limits: 1
  nodeSelector:
    kubernetes.io/role: gpu
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

  # Model store / init container configuration
  modelStore:
    enabled: false
    # Secret that contains the 'url' key with the model artifact location (e.g., S3 presigned URL or http URL)
    secretName: model-store-secret
    # Init container image used to fetch the model (replace with awscli/gsutil for your store)
    initImage: curlimages/curl:7.88.1

  # PVC configuration for storing model artifacts
  pvc:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 50Gi

  # Resource settings for model server
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

secrets:
  modelCredentialsSecret: ""
